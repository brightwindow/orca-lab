<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pikachu Runner — MCRG</title>
<style>
  :root{
    --bg:#0E0B1A; --card:#171326; --edge:#2A2340;
    --text:#E9E4F5; --dim:#9A93B5; --gold:#F7D02C;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #241a3d 0%, transparent 60%),
      var(--bg);
    color:var(--text); min-height:100%;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",
                system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; user-select:none;
  }

  .frame{
    width:100%; max-width:880px; border-radius:18px; overflow:hidden;
    background:var(--card); border:1px solid var(--edge);
    box-shadow:0 30px 80px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  }
  .bar{
    display:flex; align-items:center; gap:10px;
    padding:11px 16px; border-bottom:1px solid var(--edge);
    background:linear-gradient(180deg,#1D1830,#171326);
  }
  .dot{width:10px; height:10px; border-radius:50%; background:#3A3355}
  .dot.a{background:#F7D02C} .dot.b{background:#E4572E}
  .title{
    margin-left:6px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
  }
  .title b{color:var(--gold); font-weight:700}
  canvas{display:block; width:100%; height:auto; cursor:pointer;
         touch-action:manipulation; background:#120E22}

  .legend{
    display:flex; gap:22px; flex-wrap:wrap; justify-content:center;
    font-size:13.5px; color:var(--dim);
  }
  .legend span{display:inline-flex; align-items:center; gap:7px}
  kbd{
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:11.5px;
    color:var(--text); background:#221C38; border:1px solid var(--edge);
    border-bottom-width:2px; border-radius:5px; padding:2px 7px;
  }
  @media (max-width:520px){ .legend{gap:14px; font-size:12.5px} }
</style>
</head>
<body>
  <div class="frame">
    <div class="bar">
      <i class="dot a"></i><i class="dot b"></i><i class="dot"></i>
      <span class="title"><b>MCRG</b> · Pikachu Runner</span>
    </div>
    <canvas id="game" width="1760" height="660" aria-label="피카츄 러너"></canvas>
  </div>

  <p class="legend">
    <span><kbd>Space</kbd> / <kbd>↑</kbd> 점프</span>
    <span><kbd>↓</kbd> 숙이기</span>
    <span><kbd>화면 클릭</kbd> 도 됩니다</span>
  </p>

<script>
(function(){
  "use strict";

  var cv = document.getElementById("game"), cx = cv.getContext("2d");
  var W = cv.width, H = cv.height;
  var GY = H - 132;                       // 지면 y
  var rm = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── 팔레트 ──────────────────────────────────────────────────────────
  var SKY = [[0,"#141033"],[0.42,"#3B2159"],[0.72,"#8E3B5B"],[0.88,"#E0704B"],[1,"#F6B25E"]];
  var HILL = ["#241A44","#1C1435","#150F28"];
  var GROUND = "#100B1E", GRASS = "#2A1D4A";
  var YEL = "#F7D02C", YEL_D = "#D9A800", DARK = "#241A08",
      CHEEK = "#EE5B4B", GLOW = "rgba(247,208,44,.30)";

  // ── 상태 ────────────────────────────────────────────────────────────
  var S = {READY:0, RUN:1, OVER:2}, state;
  var last, speed, dist, score, best, obs, dust, shake, blink, flash;
  var P = {x:190, y:0, vy:0, w:76, h:84, duck:false, run:0, sq:1};
  var G = 5200, JUMP = -1580, V0 = 620;

  try { best = +(localStorage.getItem("mcrg-pikachu") || 0) || 0; } catch(e){ best = 0; }

  function reset(){
    state = S.READY; speed = V0; dist = 0; score = 0;
    obs = []; dust = []; shake = 0; blink = 0; flash = 0;
    P.y = 0; P.vy = 0; P.duck = false; P.run = 0; P.sq = 1;
    last = 0;
  }
  function begin(){ if (state === S.RUN) return; reset(); state = S.RUN; hop(); }
  function hop(){
    if (P.y === 0){ P.vy = JUMP; P.sq = 0.78; puff(P.x + 30, GY, 7); }
  }
  function tap(){ state === S.RUN ? hop() : begin(); }

  addEventListener("keydown", function(e){
    if (e.code === "Space" || e.code === "ArrowUp"){ e.preventDefault(); tap(); }
    if (e.code === "ArrowDown") P.duck = true;
  });
  addEventListener("keyup", function(e){ if (e.code === "ArrowDown") P.duck = false; });
  cv.addEventListener("pointerdown", function(e){ e.preventDefault(); tap(); });

  // ── 먼지 ────────────────────────────────────────────────────────────
  function puff(x, y, n){
    if (rm) return;
    for (var i = 0; i < n; i++)
      dust.push({x:x, y:y, vx:-40 - Math.random()*180, vy:-Math.random()*150,
                 r:3 + Math.random()*7, a:0.5});
  }

  // ── 장애물 ──────────────────────────────────────────────────────────
  function spawn(){
    var tall = Math.random() < 0.34;
    var n = 1 + ((Math.random() * (tall ? 2 : 3)) | 0);
    var uw = tall ? 30 : 22, h = tall ? 104 : 70;
    obs.push({x:W + 40, uw:uw, h:h, n:n, w:uw*n + (n-1)*9});
  }

  function rr(x, y, w, h, r){
    cx.beginPath();
    if (cx.roundRect) cx.roundRect(x, y, w, h, r);
    else cx.rect(x, y, w, h);
    cx.fill();
  }

  // ── 배경 ────────────────────────────────────────────────────────────
  var sky = null;
  function drawSky(){
    if (!sky){
      sky = cx.createLinearGradient(0, 0, 0, GY + 40);
      for (var i = 0; i < SKY.length; i++) sky.addColorStop(SKY[i][0], SKY[i][1]);
    }
    cx.fillStyle = sky; cx.fillRect(0, 0, W, GY + 40);

    // 지는 해
    var sx = W * 0.76, sy = GY - 96;
    var g = cx.createRadialGradient(sx, sy, 8, sx, sy, 190);
    g.addColorStop(0, "rgba(255,214,150,.95)");
    g.addColorStop(0.35, "rgba(255,164,96,.42)");
    g.addColorStop(1, "rgba(255,140,80,0)");
    cx.fillStyle = g; cx.beginPath(); cx.arc(sx, sy, 190, 0, 7); cx.fill();
    cx.fillStyle = "rgba(255,228,178,.92)";
    cx.beginPath(); cx.arc(sx, sy, 46, 0, 7); cx.fill();

    // 배경 마크 — 하늘에 크게, 아주 옅게
    cx.save();
    cx.globalAlpha = 0.07; cx.fillStyle = "#FFFFFF";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.font = "800 190px system-ui, sans-serif";
    if (cx.letterSpacing !== undefined) cx.letterSpacing = "26px";
    cx.fillText("MCRG", W / 2, GY - 250);
    cx.restore();
  }

  function hills(layer, sp, amp, base, col){
    var off = (dist * sp) % 460;
    cx.fillStyle = col; cx.beginPath(); cx.moveTo(-off - 460, GY);
    for (var x = -460; x <= W + 460; x += 46){
      var k = (x + off + layer * 700) * 0.0042;
      var y = GY - base - Math.sin(k) * amp - Math.sin(k * 2.3 + layer) * amp * 0.4;
      cx.lineTo(x - off, y);
    }
    cx.lineTo(W + 460, GY); cx.closePath(); cx.fill();
  }

  function drawGround(){
    cx.fillStyle = GROUND; cx.fillRect(0, GY, W, H - GY);
    cx.fillStyle = GRASS;  cx.fillRect(0, GY, W, 5);
    cx.fillStyle = "rgba(255,255,255,.05)";
    var off = dist % 150;
    for (var x = -off; x < W; x += 150){
      cx.fillRect(x + 24, GY + 30, 54, 4);
      cx.fillRect(x + 100, GY + 58, 28, 4);
    }
  }

  // ── 피카츄 ──────────────────────────────────────────────────────────
  function pikachu(){
    var duck = P.duck && P.y === 0;
    var h = duck ? 52 : P.h * P.sq;
    var w = duck ? 104 : P.w;
    var x = P.x, y = GY - h - P.y;

    // 그림자 (높이에 따라 작아짐)
    var k = Math.max(0, 1 - P.y / 260);
    cx.save(); cx.globalAlpha = 0.34 * k; cx.fillStyle = "#000";
    cx.beginPath(); cx.ellipse(x + w/2, GY + 3, 40 * k + 14, 8 * k + 3, 0, 0, 7);
    cx.fill(); cx.restore();

    // 발광
    cx.save(); cx.shadowColor = GLOW; cx.shadowBlur = 34;

    var s = w / 76;                       // 기준 76px 대비 배율
    function px(a, b, c, d, col){
      cx.fillStyle = col || YEL;
      rr(x + a*s, y + b*(h/84), c*s, d*(h/84), 3);
    }

    if (duck){
      px(-14, 6, 26, 12, DARK);           // 꼬리
      px(0, 4, 78, 40);                   // 몸통
      px(68, -6, 34, 34);                 // 머리
      px(82, -30, 13, 26, DARK);          // 귀
      px(70, 12, 12, 10, CHEEK);
      px(90, 2, 7, 7, DARK);
      px(6, 40, 18, 10, YEL_D); px(44, 40, 18, 10, YEL_D);
      cx.restore(); return;
    }

    // 꼬리 (번개)
    px(-26, 34, 20, 14, YEL_D);
    px(-38, 14, 22, 15);
    px(-22, 26, 18, 14);

    // 귀
    px(18, -30, 14, 36); px(46, -34, 14, 40);
    px(18, -36, 14, 12, DARK); px(46, -41, 14, 12, DARK);

    // 머리 / 몸통
    px(10, -4, 58, 46);
    px(6, 34, 58, 46);

    // 얼굴
    px(24, 10, 9, 11, DARK); px(48, 10, 9, 11, DARK);
    px(26, 12, 3, 3, "#FFF");  px(50, 12, 3, 3, "#FFF");
    px(38, 24, 6, 4, DARK);
    px(10, 20, 13, 11, CHEEK); px(56, 20, 13, 11, CHEEK);

    // 팔 · 다리
    px(0, 44, 13, 18, YEL_D);
    var sw = ((P.run | 0) % 2) === 0;
    if (P.y > 0){ px(14, 74, 14, 14, YEL_D); px(40, 74, 14, 14, YEL_D); }
    else if (sw){ px(14, 74, 14, 18, YEL_D); px(40, 76, 14, 10, YEL_D); }
    else        { px(14, 76, 14, 10, YEL_D); px(40, 74, 14, 18, YEL_D); }

    cx.restore();
  }

  function drawObs(o){
    // 바닥 그림자 — 이게 없으면 장애물이 공중에 뜬 것처럼 보인다
    cx.save(); cx.globalAlpha = 0.5; cx.fillStyle = "#0A0616";
    cx.beginPath();
    cx.ellipse(o.x + o.w/2, GY + 4, o.w/2 + 16, 9, 0, 0, 7);
    cx.fill(); cx.restore();

    for (var i = 0; i < o.n; i++){
      var x = o.x + i * (o.uw + 9), y = GY - o.h;
      cx.fillStyle = "#0F0A1E"; rr(x - 2, y - 2, o.uw + 4, o.h + 4, o.uw/2.2); // 외곽
      cx.fillStyle = "#33245A"; rr(x, y, o.uw, o.h, o.uw/2.4);                 // 몸
      cx.fillStyle = "#1B1235"; rr(x + 3, y + 6, o.uw - 6, o.h - 10, o.uw/3);  // 안쪽 그늘
      cx.fillStyle = "rgba(255,186,128,.75)";                                  // 림라이트
      rr(x + o.uw - 7, y + 9, 5, o.h - 20, 3);
      // 팔
      cx.fillStyle = "#0F0A1E"; rr(x - 15, y + o.h*0.30 - 2, 17, o.h*0.19 + 4, 7);
      cx.fillStyle = "#33245A"; rr(x - 13, y + o.h*0.30, 14, o.h*0.19, 6);
      cx.fillStyle = "#0F0A1E"; rr(x + o.uw - 2, y + o.h*0.48 - 2, 17, o.h*0.17 + 4, 7);
      cx.fillStyle = "#33245A"; rr(x + o.uw, y + o.h*0.48, 14, o.h*0.17, 6);
    }
  }

  // ── HUD ─────────────────────────────────────────────────────────────
  function hud(){
    cx.textAlign = "right"; cx.textBaseline = "alphabetic";
    cx.font = "700 20px ui-monospace, Consolas, monospace";
    if (cx.letterSpacing !== undefined) cx.letterSpacing = "2px";
    if (best){
      cx.fillStyle = "rgba(233,228,245,.45)";
      cx.fillText("HI " + ("" + best).padStart(5, "0"), W - 200, 62);
    }
    cx.fillStyle = "#FFF6D8";
    cx.font = "800 40px ui-monospace, Consolas, monospace";
    cx.fillText(("" + (score | 0)).padStart(5, "0"), W - 44, 66);
    if (cx.letterSpacing !== undefined) cx.letterSpacing = "0px";
    cx.textAlign = "left";
  }

  function panel(title, sub){
    cx.save();
    cx.fillStyle = "rgba(10,7,20,.62)"; cx.fillRect(0, 0, W, H);
    cx.textAlign = "center";
    cx.fillStyle = "#FFF6D8";
    cx.font = "800 62px system-ui, sans-serif";
    cx.fillText(title, W/2, H/2 - 6);
    cx.fillStyle = "rgba(233,228,245,.72)";
    cx.font = "400 25px system-ui, sans-serif";
    cx.fillText(sub, W/2, H/2 + 46);
    cx.textAlign = "left"; cx.restore();
  }

  // ── 루프 ────────────────────────────────────────────────────────────
  function frame(ts){
    requestAnimationFrame(frame);
    if (!last) last = ts;
    var dt = Math.min((ts - last)/1000, 0.05); last = ts;

    if (state === S.RUN){
      dist  += speed * dt;
      score += speed * dt * 0.045;
      speed += 13 * dt;

      var was = P.y;
      P.vy += G * dt; P.y -= P.vy * dt;
      if (P.y < 0){
        P.y = 0; P.vy = 0;
        if (was > 6){ P.sq = 1.22; puff(P.x + 24, GY, 10); shake = 5; }
      }
      P.sq += (1 - P.sq) * Math.min(1, dt * 12);
      P.run += dt * speed / 46;
      if (P.y === 0 && ((P.run|0) % 2) === 0 && Math.random() < dt * 9)
        puff(P.x + 12, GY, 1);

      var lastO = obs[obs.length - 1];
      if (!lastO || W - lastO.x > 330 + Math.random() * 420) spawn();
      for (var i = obs.length - 1; i >= 0; i--){
        obs[i].x -= speed * dt;
        if (obs[i].x + obs[i].w < -60) obs.splice(i, 1);
      }

      var duck = P.duck && P.y === 0;
      var ph = duck ? 52 : P.h, pw = duck ? 104 : P.w, py = GY - ph - P.y;
      for (var k2 = 0; k2 < obs.length; k2++){
        var o = obs[k2];
        if (P.x + 16 < o.x + o.w - 8 && P.x + pw - 16 > o.x + 8 &&
            py + ph - 10 > GY - o.h + 8){
          state = S.OVER; shake = 16; flash = 1;
          puff(P.x + 40, GY - 30, 16);
          if ((score|0) > best){
            best = score | 0;
            try { localStorage.setItem("mcrg-pikachu", "" + best); } catch(e){}
          }
        }
      }
    }

    for (var d = dust.length - 1; d >= 0; d--){
      var p = dust[d];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 340 * dt; p.a -= dt * 1.15;
      if (p.a <= 0) dust.splice(d, 1);
    }
    if (shake > 0) shake = Math.max(0, shake - dt * 46);
    if (flash > 0) flash = Math.max(0, flash - dt * 3.2);

    // 그리기
    cx.save();
    if (shake > 0.2)
      cx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

    drawSky();
    hills(0, 0.055, 46, 118, HILL[0]);
    hills(1, 0.11, 62, 66,  HILL[1]);
    hills(2, 0.20, 40, 20,  HILL[2]);
    drawGround();

    for (var m = 0; m < obs.length; m++) drawObs(obs[m]);

    cx.save();
    for (var n = 0; n < dust.length; n++){
      var q = dust[n];
      cx.globalAlpha = Math.max(0, q.a);
      cx.fillStyle = "#C8B9E8";
      cx.beginPath(); cx.arc(q.x, q.y, q.r, 0, 7); cx.fill();
    }
    cx.restore();

    pikachu();
    cx.restore();

    hud();

    if (flash > 0){
      cx.fillStyle = "rgba(255,120,90," + (flash * 0.34) + ")";
      cx.fillRect(0, 0, W, H);
    }
    if (state === S.READY){
      blink += dt;
      if (rm || (blink * 1.5 | 0) % 2 === 0)
        panel("PIKACHU RUNNER", "스페이스바를 눌러 시작");
    }
    if (state === S.OVER) panel("GAME OVER", "스페이스바로 다시 시작");
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
