<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스톱워치 — 이런 게 뜨면 성공</title>
<style>
  :root{
    --paper:#F8F8F6; --card:#FFFFFF; --ink:#1C1F1D; --muted:#6C726E;
    --line:#E0E1DC; --go:#2F6A4F; --stop:#A8542F; --zero:#6C726E;
    --shadow:0 1px 2px rgba(28,31,29,.05), 0 10px 30px rgba(28,31,29,.07);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#141715; --card:#1C201E; --ink:#E9EAE6; --muted:#969C98;
      --line:#2B302D; --go:#79B392; --stop:#D98C64; --zero:#969C98;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141715; --card:#1C201E; --ink:#E9EAE6; --muted:#969C98;
    --line:#2B302D; --go:#79B392; --stop:#D98C64; --zero:#969C98;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",
                system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; gap:18px;
  }
  .card{
    width:100%; max-width:420px; background:var(--card);
    border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:40px 28px 28px; text-align:center;
  }
  #t{
    font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
    font-variant-numeric:tabular-nums; font-size:clamp(46px,14vw,68px);
    font-weight:600; letter-spacing:.01em; line-height:1; margin-bottom:30px;
  }
  #t .cs{font-size:.55em; color:var(--muted)}
  .row{display:flex; gap:10px; justify-content:center}
  button{
    flex:1; font:inherit; font-size:16px; font-weight:600;
    padding:14px 6px; border:1px solid var(--line); border-radius:9px;
    background:var(--paper); color:var(--ink); cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  button:hover:not(:disabled){border-color:currentColor}
  button:focus-visible{outline:2px solid var(--go); outline-offset:2px}
  button:disabled{opacity:.4; cursor:default}
  #go{color:var(--go)} #halt{color:var(--stop)} #zero{color:var(--zero)}
  .note{
    max-width:420px; font-size:13.5px; line-height:1.7; color:var(--muted);
    text-align:left;
  }
  .note b{color:var(--ink); font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <div id="t" role="timer" aria-live="off">00:00<span class="cs">.00</span></div>
    <div class="row">
      <button id="go">시작</button>
      <button id="halt" disabled>정지</button>
      <button id="zero" disabled>초기화</button>
    </div>
  </main>

  <p class="note">
    <b>어떻게 시간을 재는가</b><br>
    1. 시작할 때 <code>performance.now()</code> 값을 원점으로 잡고, 화면을 그릴 때마다 지금 시각에서 그 원점을 뺀다.<br>
    2. 정지하면 그때까지 흐른 시간을 따로 쌓아 두고, 다시 시작할 때 원점을 새로 잡아 그 값에 더한다.<br>
    3. 10 ms 간격은 화면을 다시 그리는 주기일 뿐이고, 보이는 숫자는 언제나 실제 경과 시간에서 계산한다.
  </p>

<script>
(function(){
  "use strict";
  var origin = 0, banked = 0, running = false, ticker = null;
  var el   = document.getElementById("t");
  var go   = document.getElementById("go");
  var halt = document.getElementById("halt");
  var zero = document.getElementById("zero");

  function elapsed(){
    return running ? banked + (performance.now() - origin) : banked;
  }
  function paint(){
    var ms = Math.floor(elapsed());
    var cs = Math.floor(ms % 1000 / 10);
    var s  = Math.floor(ms / 1000) % 60;
    var m  = Math.floor(ms / 60000);
    el.firstChild.nodeValue =
      String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    el.querySelector(".cs").textContent = "." + String(cs).padStart(2,"0");
  }
  go.addEventListener("click", function(){
    if (running) return;
    origin = performance.now();
    running = true;
    ticker = setInterval(paint, 10);
    go.disabled = true; halt.disabled = false; zero.disabled = false;
  });
  halt.addEventListener("click", function(){
    if (!running) return;
    banked = elapsed();            // 멈춘 순간의 실제 경과를 확정해 둔다
    running = false;
    clearInterval(ticker); ticker = null;
    go.disabled = false; halt.disabled = true;
    paint();
  });
  zero.addEventListener("click", function(){
    clearInterval(ticker); ticker = null;
    running = false; origin = 0; banked = 0;
    go.disabled = false; halt.disabled = true; zero.disabled = true;
    paint();
  });
  paint();
})();
</script>
</body>
</html>
