<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스톱워치 — 이런 게 뜨면 성공</title>
<style>
  :root{
    --paper:#F8F8F6; --card:#FFFFFF; --ink:#1C1F1D; --muted:#6C726E;
    --line:#E0E1DC; --go:#2F6A4F; --stop:#A8542F; --lap:#2E5C7A; --zero:#6C726E;
    --shadow:0 1px 2px rgba(28,31,29,.05), 0 10px 30px rgba(28,31,29,.07);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#141715; --card:#1C201E; --ink:#E9EAE6; --muted:#969C98;
      --line:#2B302D; --go:#79B392; --stop:#D98C64; --lap:#79A6C6; --zero:#969C98;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#141715; --card:#1C201E; --ink:#E9EAE6; --muted:#969C98;
    --line:#2B302D; --go:#79B392; --stop:#D98C64; --lap:#79A6C6; --zero:#969C98;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",
                system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; gap:18px;
  }
  .card{
    width:100%; max-width:430px; background:var(--card);
    border:1px solid var(--line); border-radius:16px;
    box-shadow:var(--shadow); padding:38px 26px 26px;
  }
  #t{
    text-align:center;
    font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
    font-variant-numeric:tabular-nums; font-size:clamp(44px,13vw,64px);
    font-weight:600; letter-spacing:.01em; line-height:1; margin-bottom:28px;
  }
  #t .cs{font-size:.55em; color:var(--muted)}
  .row{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  button{
    font:inherit; font-size:15px; font-weight:600;
    padding:13px 4px; border:1px solid var(--line); border-radius:9px;
    background:var(--paper); color:var(--ink); cursor:pointer;
    transition:background .12s, border-color .12s;
  }
  button:hover:not(:disabled){border-color:currentColor}
  button:focus-visible{outline:2px solid var(--go); outline-offset:2px}
  button:disabled{opacity:.38; cursor:default}
  #go{color:var(--go)} #halt{color:var(--stop)}
  #lap{color:var(--lap)} #zero{color:var(--zero)}

  #laps{list-style:none; margin:22px 0 0; padding:0;
    max-height:190px; overflow-y:auto}
  #laps:empty{display:none}
  #laps li{
    display:grid; grid-template-columns:auto 1fr auto; gap:12px;
    align-items:baseline; padding:9px 4px; border-top:1px solid var(--line);
    font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
    font-variant-numeric:tabular-nums; font-size:13.5px;
  }
  #laps .n{color:var(--muted); font-size:11px}
  #laps .tot{font-weight:600}
  #laps .sp{color:var(--muted); text-align:right}

  .note{max-width:430px; font-size:13.5px; line-height:1.7;
    color:var(--muted); text-align:left}
  .note b{color:var(--ink); font-weight:600}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="card">
    <div id="t" role="timer" aria-live="off">00:00<span class="cs">.00</span></div>
    <div class="row">
      <button id="go">시작</button>
      <button id="halt" disabled>정지</button>
      <button id="lap"  disabled>랩</button>
      <button id="zero" disabled>초기화</button>
    </div>
    <ul id="laps"></ul>
  </main>

  <p class="note">
    <b>어떻게 시간을 재는가</b><br>
    1. 시작할 때 <code>performance.now()</code> 값을 원점으로 잡고, 화면을 그릴 때마다 지금 시각에서 그 원점을 뺀다.<br>
    2. 정지하면 그때까지 흐른 시간을 따로 쌓아 두고, 다시 시작할 때 원점을 새로 잡아 그 값에 더한다.<br>
    3. 10 ms 간격은 화면을 다시 그리는 주기일 뿐이고, 보이는 숫자와 랩 시각은 언제나 실제 경과 시간에서 계산한다.
  </p>

<script>
(function(){
  "use strict";
  var origin = 0, banked = 0, running = false, ticker = null, laps = [];
  var el   = document.getElementById("t");
  var go   = document.getElementById("go");
  var halt = document.getElementById("halt");
  var lap  = document.getElementById("lap");
  var zero = document.getElementById("zero");
  var list = document.getElementById("laps");

  function elapsed(){
    return running ? banked + (performance.now() - origin) : banked;
  }
  function parts(ms){
    var v  = Math.floor(ms);
    return {
      head: String(Math.floor(v / 60000)).padStart(2,"0") + ":" +
            String(Math.floor(v / 1000) % 60).padStart(2,"0"),
      cs:   String(Math.floor(v % 1000 / 10)).padStart(2,"0")
    };
  }
  function flat(ms){ var p = parts(ms); return p.head + "." + p.cs; }

  function paint(){
    var p = parts(elapsed());
    el.firstChild.nodeValue = p.head;
    el.querySelector(".cs").textContent = "." + p.cs;
  }

  go.addEventListener("click", function(){
    if (running) return;
    origin = performance.now();
    running = true;
    ticker = setInterval(paint, 10);
    go.disabled = true; halt.disabled = false;
    lap.disabled = false; zero.disabled = false;
  });

  halt.addEventListener("click", function(){
    if (!running) return;
    banked = elapsed();          // 멈춘 순간의 실제 경과를 확정해 둔다
    running = false;
    clearInterval(ticker); ticker = null;
    go.disabled = false; halt.disabled = true; lap.disabled = true;
    paint();
  });

  lap.addEventListener("click", function(){
    var at   = elapsed();
    var prev = laps.length ? laps[laps.length - 1] : 0;
    laps.push(at);

    var li = document.createElement("li");
    var n  = document.createElement("span"); n.className = "n";
    n.textContent = "#" + String(laps.length).padStart(2,"0");
    var tot = document.createElement("span"); tot.className = "tot";
    tot.textContent = flat(at);              // 화면 표시와 같은 기준의 시각
    var sp = document.createElement("span"); sp.className = "sp";
    sp.textContent = "+" + flat(at - prev);
    li.append(n, tot, sp);
    list.prepend(li);
  });

  zero.addEventListener("click", function(){
    clearInterval(ticker); ticker = null;
    running = false; origin = 0; banked = 0;
    laps = []; list.textContent = "";        // 초기화는 랩 목록도 함께 비운다
    go.disabled = false; halt.disabled = true;
    lap.disabled = true; zero.disabled = true;
    paint();
  });

  paint();
})();
</script>
</body>
</html>
